# Reusable entrypoint: parse `/backport v1.2.3` from a PR comment and run reuse-backport-from-pr.
# Runs the backport only when the comment is a valid `/backport <tag>` command and the PR is merged.
#
# Caller `backport.yml` (recommended):
#   on:
#     issue_comment:
#       types: [created]
#     pull_request:
#       types: [closed]
#       branches: [backport/**]
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     backport-from-comment:
#       if: |
#         github.event_name == 'issue_comment' &&
#         github.event.issue.pull_request &&
#         github.event.comment.user.type == 'User' &&
#         contains(github.event.comment.body, '/backport')
#       uses: oat-sa/extension-release-action/.github/workflows/reuse-backport-from-comment.yaml@main
#       with:
#         COMMENT_BODY: ${{ github.event.comment.body }}
#         SOURCE_PR_NUMBER: ${{ github.event.issue.number }}
#       secrets: inherit
#
name: Backport from PR comment (Reusable)

on:
  workflow_call:
    inputs:
      COMMENT_BODY:
        description: 'Comment body containing `/backport <tag>` (e.g. `/backport v1.2.3`).'
        required: true
        type: string
      SOURCE_PR_NUMBER:
        description: 'Pull request number the comment was posted on.'
        required: true
        type: number
      VERSION_PREFIX:
        required: false
        type: string
        default: 'v'
      RELEASE_VERSION:
        required: false
        type: string
        default: ''
      BOT_USER_NAME:
        required: false
        type: string
        default: oat-github-bot
      BOT_USER_EMAIL:
        required: false
        type: string
        default: oat-github-bot@taotesting.com
    secrets:
      SEMVER_GH_TOKEN:
        required: false

jobs:
  gate:
    name: Validate /backport on merged PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      proceed: ${{ steps.validate.outputs.proceed }}
      base_tag: ${{ steps.validate.outputs.base_tag }}
    steps:
      - name: Parse command and check pull request is merged
        id: validate
        env:
          COMMENT_BODY: ${{ inputs.COMMENT_BODY }}
          SOURCE_PR_NUMBER: ${{ inputs.SOURCE_PR_NUMBER }}
          GH_TOKEN: ${{ secrets.SEMVER_GH_TOKEN || github.token }}
        run: |
          set -euo pipefail

          skip() {
            echo "$1"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          BASE_TAG="$(printf '%s' "$COMMENT_BODY" | tr '\n' ' ' | sed -nE 's#.*(^|[^a-zA-Z0-9])/?backport[[:space:]]+([^[:space:]]+).*#\2#p' | head -n 1)"
          if [ -z "$BASE_TAG" ]; then
            skip "Comment is not a valid /backport <tag> command. Skipping."
          fi

          if ! echo "$COMMENT_BODY" | tr '\n' ' ' | grep -qE '(^|[[:space:]])/?backport[[:space:]]+[^[:space:]]+'; then
            skip "Comment does not match /backport <tag>. Skipping."
          fi

          MERGED="$(gh pr view "$SOURCE_PR_NUMBER" --repo "${{ github.repository }}" --json merged --jq '.merged' 2>/dev/null || echo false)"
          if [ "$MERGED" != "true" ]; then
            skip "Pull request #${SOURCE_PR_NUMBER} is not merged. Backport runs only after merge."
          fi

          echo "base_tag=${BASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "Backport approved for merged PR #${SOURCE_PR_NUMBER} onto ${BASE_TAG}"

  backport:
    name: Run backport
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/reuse-backport-from-pr.yaml
    with:
      SOURCE_PR_NUMBER: ${{ inputs.SOURCE_PR_NUMBER }}
      BASE_TAG: ${{ needs.gate.outputs.base_tag }}
      VERSION_PREFIX: ${{ inputs.VERSION_PREFIX }}
      RELEASE_VERSION: ${{ inputs.RELEASE_VERSION }}
      BOT_USER_NAME: ${{ inputs.BOT_USER_NAME }}
      BOT_USER_EMAIL: ${{ inputs.BOT_USER_EMAIL }}
    secrets: inherit
