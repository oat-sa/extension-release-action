# Reusable entrypoint: parse `/backport v1.2.3` from a PR comment and run reuse-backport-from-pr.
#
# Caller example:
#   on:
#     issue_comment:
#       types: [created]
#   jobs:
#     backport:
#       if: github.event.issue.pull_request && contains(github.event.comment.body, '/backport')
#       uses: oat-sa/extension-release-action/.github/workflows/reuse-backport-from-comment.yaml@main
#       with:
#         COMMENT_BODY: ${{ github.event.comment.body }}
#         SOURCE_PR_NUMBER: ${{ github.event.issue.number }}
#         VERSION_PREFIX: v
#       secrets: inherit
#
name: Backport from PR comment (Reusable)

on:
  workflow_call:
    inputs:
      COMMENT_BODY:
        description: 'Comment body containing `/backport <tag>` (e.g. `/backport v1.2.3`).'
        required: true
        type: string
      SOURCE_PR_NUMBER:
        description: 'Pull request number the comment was posted on.'
        required: true
        type: number
      VERSION_PREFIX:
        required: false
        type: string
        default: 'v'
      RELEASE_VERSION:
        required: false
        type: string
        default: ''
      BOT_USER_NAME:
        required: false
        type: string
        default: oat-github-bot
      BOT_USER_EMAIL:
        required: false
        type: string
        default: oat-github-bot@taotesting.com
    secrets:
      SEMVER_GH_TOKEN:
        required: false

jobs:
  parse:
    name: Parse /backport command
    runs-on: ubuntu-latest
    outputs:
      base_tag: ${{ steps.parse.outputs.base_tag }}
    steps:
      - name: Parse comment
        id: parse
        env:
          COMMENT_BODY: ${{ inputs.COMMENT_BODY }}
        run: |
          set -euo pipefail

          BASE_TAG="$(printf '%s' "$COMMENT_BODY" | tr '\n' ' ' | sed -nE 's#.*(^|[^a-zA-Z0-9])/?backport[[:space:]]+([^[:space:]]+).*#\2#p' | head -n 1)"
          if [ -z "$BASE_TAG" ]; then
            echo "::error::Comment does not contain a valid /backport <tag> command."
            exit 1
          fi

          echo "base_tag=${BASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Parsed BASE_TAG=${BASE_TAG}"

  backport:
    name: Run backport
    needs: parse
    uses: ./.github/workflows/reuse-backport-from-pr.yaml
    with:
      SOURCE_PR_NUMBER: ${{ inputs.SOURCE_PR_NUMBER }}
      BASE_TAG: ${{ needs.parse.outputs.base_tag }}
      VERSION_PREFIX: ${{ inputs.VERSION_PREFIX }}
      RELEASE_VERSION: ${{ inputs.RELEASE_VERSION }}
      BOT_USER_NAME: ${{ inputs.BOT_USER_NAME }}
      BOT_USER_EMAIL: ${{ inputs.BOT_USER_EMAIL }}
    secrets: inherit
