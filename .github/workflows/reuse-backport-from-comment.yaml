# Reusable entrypoint: parse `/backport v1.2.3` from a PR comment and run reuse-backport-from-pr.
#
# Caller `backport.yml` (recommended — limits noise from release PRs and bot comments):
#   on:
#     issue_comment:
#       types: [created]
#     pull_request:
#       types: [closed]
#       branches: [backport/**]   # base branch; skips release PRs into develop/master
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     backport-from-comment:
#       if: |
#         github.event_name == 'issue_comment' &&
#         github.event.issue.pull_request &&
#         github.event.comment.user.type == 'User' &&
#         contains(github.event.comment.body, '/backport')
#       uses: oat-sa/extension-release-action/.github/workflows/reuse-backport-from-comment.yaml@main
#       ...
#     backport-release:
#       if: |
#         github.event_name == 'pull_request' &&
#         github.event.pull_request.merged &&
#         startsWith(github.event.pull_request.head.ref, 'tmp-backport-pr-')
#       uses: oat-sa/extension-release-action/.github/workflows/reuse-backport-release-on-merge.yaml@main
#       ...
#
# Note: `issue_comment` still starts a workflow run on every PR comment; the job `if` skips
# non-commands. `pull_request.branches` avoids runs when unrelated PRs (e.g. release/v*) close.
#
name: Backport from PR comment (Reusable)

on:
  workflow_call:
    inputs:
      COMMENT_BODY:
        description: 'Comment body containing `/backport <tag>` (e.g. `/backport v1.2.3`).'
        required: true
        type: string
      SOURCE_PR_NUMBER:
        description: 'Pull request number the comment was posted on.'
        required: true
        type: number
      VERSION_PREFIX:
        required: false
        type: string
        default: 'v'
      RELEASE_VERSION:
        required: false
        type: string
        default: ''
      BOT_USER_NAME:
        required: false
        type: string
        default: oat-github-bot
      BOT_USER_EMAIL:
        required: false
        type: string
        default: oat-github-bot@taotesting.com
    secrets:
      SEMVER_GH_TOKEN:
        required: false

jobs:
  parse:
    name: Parse /backport command
    runs-on: ubuntu-latest
    outputs:
      base_tag: ${{ steps.parse.outputs.base_tag }}
    steps:
      - name: Parse comment
        id: parse
        env:
          COMMENT_BODY: ${{ inputs.COMMENT_BODY }}
        run: |
          set -euo pipefail

          BASE_TAG="$(printf '%s' "$COMMENT_BODY" | tr '\n' ' ' | sed -nE 's#.*(^|[^a-zA-Z0-9])/?backport[[:space:]]+([^[:space:]]+).*#\2#p' | head -n 1)"
          if [ -z "$BASE_TAG" ]; then
            echo "::error::Comment does not contain a valid /backport <tag> command."
            exit 1
          fi

          echo "base_tag=${BASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Parsed BASE_TAG=${BASE_TAG}"

  backport:
    name: Run backport
    needs: parse
    uses: ./.github/workflows/reuse-backport-from-pr.yaml
    with:
      SOURCE_PR_NUMBER: ${{ inputs.SOURCE_PR_NUMBER }}
      BASE_TAG: ${{ needs.parse.outputs.base_tag }}
      VERSION_PREFIX: ${{ inputs.VERSION_PREFIX }}
      RELEASE_VERSION: ${{ inputs.RELEASE_VERSION }}
      BOT_USER_NAME: ${{ inputs.BOT_USER_NAME }}
      BOT_USER_EMAIL: ${{ inputs.BOT_USER_EMAIL }}
    secrets: inherit
